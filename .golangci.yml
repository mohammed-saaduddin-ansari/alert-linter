version: "2"

linters:
  enable:
    - errorlint
    - gocritic
    - unconvert
    - nolintlint
  settings:
    errcheck:
      # Diagnostics written to stderr or a tabwriter: nothing useful to do on failure.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/mohammed-saaduddin-ansari/alert-linter
